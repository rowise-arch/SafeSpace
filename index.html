<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RSU SafeSpace</title>
  <meta name="description" content="RSU SafeSpace: guidance counseling support for Romblon State University. Choose your portal.">
  <link rel="stylesheet" href="shared/assets/css/safespace.css">
  <link rel="stylesheet" href="shared/assets/css/components.css">
  <style>
    body.ss-page { min-height: 100vh; display: grid; place-items: center; padding: var(--ss-space-6) var(--ss-space-4); background: var(--ss-bg); }
    .gate { width: 100%; max-width: 560px; text-align: center; }
    .gate img { width: 88px; height: 88px; object-fit: contain; }
    .gate h1 { margin: var(--ss-space-4) 0 var(--ss-space-2); font-size: var(--ss-text-3xl, 2rem); font-weight: 800; letter-spacing: -0.01em; color: var(--ss-text); }
    .gate p { margin: 0 auto var(--ss-space-6); max-width: 38ch; color: var(--ss-text-muted); }
    .gate ul { list-style: none; margin: 0; padding: 0; display: grid; gap: var(--ss-space-3); }
    .gate a.portal {
      display: flex; align-items: center; gap: var(--ss-space-4); text-align: left; padding: var(--ss-space-4) var(--ss-space-5);
      background: var(--ss-surface); border: 1px solid var(--ss-border); border-radius: var(--ss-radius); box-shadow: var(--ss-shadow-1);
      color: var(--ss-text); text-decoration: none; min-height: 72px;
      transition: border-color var(--ss-dur) var(--ss-ease-out), box-shadow var(--ss-dur) var(--ss-ease-out);
    }
    .gate a.portal:hover { border-color: var(--ss-primary); box-shadow: var(--ss-shadow-2); }
    .gate a.portal strong { display: block; font-size: var(--ss-text-lg); font-weight: 800; }
    .gate a.portal span.sub { color: var(--ss-text-muted); font-size: var(--ss-text-sm); }
    .gate .go { margin-left: auto; color: var(--ss-primary); font-weight: 800; }
    .gate .about { display: inline-block; margin-top: var(--ss-space-6); }
  </style>
</head>
<body class="ss-page">
  <main class="gate">
    <img src="shared/assets/safespace.png" alt="RSU SafeSpace logo">
    <h1>RSU SafeSpace</h1>
    <p>Guidance counseling support for Romblon State University. Choose your portal.</p>
    <ul>
      <li><a class="portal" href="apps/student/pages/signin.html"><span><strong>Student</strong><span class="sub">Appointments, messages, resources</span></span><span class="go" aria-hidden="true">&rarr;</span></a></li>
      <li><a class="portal" href="apps/counselor/pages/login.html"><span><strong>Counselor</strong><span class="sub">Sessions, students, records</span></span><span class="go" aria-hidden="true">&rarr;</span></a></li>
      <li><a class="portal" href="apps/admin/pages/login.html"><span><strong>Admin</strong><span class="sub">People, content, reports</span></span><span class="go" aria-hidden="true">&rarr;</span></a></li>
    </ul>
    <a class="ss-link about" href="apps/counselor/pages/landing.html">About RSU SafeSpace</a>
  </main>
</body>
</html>
