<!doctype html>
<html lang="en">
<head>
   <script type="module">
    import { watchAuth, showUserInfo } from "./main.js";

    watchAuth(user => {
      if (!user || user.isAnonymous || !user.email) {
        window.location.replace("counselor_login.html");
      } else {
        showUserInfo(user);
      }
    });
    
      // Date/time updater for header and card
      function updateTime(){
        const now=new Date();
        const optionsDate = { weekday:'long', month:'short', day:'numeric', year:'numeric' };
        const dateStr = now.toLocaleDateString(undefined, optionsDate);
        const timeStr = now.toLocaleTimeString(undefined, {hour:'2-digit',minute:'2-digit'});
        const datetime = document.getElementById('datetime');
        const dateRight = document.getElementById('dateRight');
        if(datetime) datetime.textContent = dateStr + ' — ' + timeStr;
        if(dateRight) dateRight.textContent = dateStr + ' • ' + timeStr;
      }
      setInterval(updateTime,1000*30);
      updateTime();
  </script>
  <script>
    // Profile dropdown, confirm modal, and logout wiring
    // Run after DOM is fully parsed so elements exist
    window.addEventListener('DOMContentLoaded', function(){
    (function(){
      const topRight = document.querySelector('.top-right');
      const profileBtn = document.getElementById('profileBtn');
      // Build dropdown if missing
      if (topRight && profileBtn && !document.getElementById('profileDropdown')){
        const wrap = document.createElement('div');
        wrap.style.position = 'relative';
        wrap.style.display = 'inline-block';
        // move the profileBtn into the wrapper to anchor the menu
        if (profileBtn.parentElement === topRight){
          topRight.removeChild(profileBtn);
          wrap.appendChild(profileBtn);
        }
        const menu = document.createElement('div');
        menu.id = 'profileDropdown';
        menu.setAttribute('aria-hidden','true');
        menu.style.cssText = 'display:none;position:absolute;right:0;top:56px;background:#fff;border-radius:12px;box-shadow:0 14px 36px rgba(2,6,23,0.16);padding:8px 0;min-width:180px;z-index:1200;border:1px solid rgba(2,6,23,0.06)';
        menu.innerHTML = `
              <div class="pd-head">
                <div class="pd-avatar">
                  <img id="profileDropdownAvatar" src="" alt="Avatar" style="width:100%;height:100%;object-fit:cover;display:block;border-radius:50%;">
                  <span id="profileDropdownAvatarText" style="width:100%;height:100%;display:none;align-items:center;justify-content:center;font-weight:800;color:var(--green)"></span>
                </div>
                <div class="pd-meta">
                  <div id="profileDropdownName" class="pd-name">Hi, RSU SAFESPACE</div>
                  <div id="profileDropdownEmail" class="pd-email">rsusafespace@gmail.com</div>
                </div>
              </div>

              <div style="padding:8px 6px;display:flex;flex-direction:column;gap:6px">
                <button id="viewAccountLink" class="profile-item" style="text-align:left;padding:10px;border-radius:8px;border:0;background:transparent;cursor:pointer;display:flex;align-items:center;gap:10px">
                    <i class="material-icons icon" style="font-size:18px;line-height:1;">person</i>
                    <span style="flex:1;text-align:left">Manage your profile</span>
                </button>
                <button id="settingsBtn" class="profile-item" style="text-align:left;padding:10px;border-radius:8px;border:0;background:transparent;cursor:pointer;display:flex;align-items:center;gap:10px">
                    <i class="material-icons icon" style="font-size:18px;line-height:1;">settings</i>
                    <span style="flex:1;text-align:left">Settings &amp; privacy</span>
                    <i class="material-icons icon" style="font-size:16px;opacity:0.7;">chevron_right</i>
                </button>
                <button id="dropdownLogoutBtn" class="profile-item" style="text-align:left;padding:10px;border-radius:8px;border:0;background:transparent;cursor:pointer;display:flex;align-items:center;gap:10px;color:#111;font-weight:600">
                    <i class="material-icons icon" style="font-size:18px;line-height:1;color:#ef4444">logout</i>
                    <span style="flex:1;text-align:left">Log Out</span>
                </button>
              </div>
        `;
        wrap.appendChild(menu);
        topRight.appendChild(wrap);
      }

      const dropdown = document.getElementById('profileDropdown');
      const viewAccountLink = document.getElementById('viewAccountLink');
      const dropdownLogoutBtn = document.getElementById('dropdownLogoutBtn');

      function toggleDropdown(show){
        if (!dropdown) return;
        const willShow = typeof show === 'boolean' ? show : dropdown.style.display === 'none';
        dropdown.style.display = willShow ? 'block' : 'none';
        dropdown.setAttribute('aria-hidden', willShow ? 'false' : 'true');
      }

      if (profileBtn && dropdown){
        profileBtn.addEventListener('click', (e) => {
          e.preventDefault(); e.stopPropagation();
          toggleDropdown(dropdown.style.display === 'none');
        });
        document.addEventListener('click', (e) => {
          if (!dropdown.contains(e.target) && e.target !== profileBtn) toggleDropdown(false);
        });
        document.addEventListener('keydown', (e) => { if (e.key === 'Escape') toggleDropdown(false); });
      }

      const toast = (msg) => {
        try {
          const div = document.createElement('div');
          div.textContent = msg;
          div.style.cssText = 'position:fixed;bottom:72px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:10px 14px;border-radius:8px;z-index:4000;opacity:.96;font-size:13px';
          document.body.appendChild(div);
          setTimeout(()=> div.remove(), 2000);
        } catch(_) { alert(msg); }
      };

      function showConfirm(arg1, arg2){
        let title='Confirm', message='Are you sure?', confirmText='Confirm', cancelText='Cancel', variant='primary';
        let okBg, okHover, okColor;
        if (typeof arg1 === 'string'){
          message = arg1;
          if (arg2 && typeof arg2 === 'object'){
            confirmText = arg2.okText || confirmText;
            cancelText = arg2.cancelText || cancelText;
            okBg = arg2.okBg; okHover = arg2.okHover; okColor = arg2.okColor;
            if (!okBg && !okHover && !okColor) variant = arg2.variant || variant;
            if (!okBg && variant === 'danger') { okBg = '#dc2626'; okHover = '#b91c1c'; okColor = '#fff'; }
          }
        } else if (typeof arg1 === 'object'){
          const o = arg1 || {};
          title = o.title || title;
          message = o.message || message;
          confirmText = o.confirmText || confirmText;
          cancelText = o.cancelText || cancelText;
          variant = o.variant || variant;
        }

        // Prefer DOM modal
        const modal = document.getElementById('confirmModal');
        const msgEl = document.getElementById('confirmModalMessage');
        const titleEl = document.getElementById('confirmModalTitle');
        const okBtn = document.getElementById('confirmOkBtn');
        const cancelBtn = document.getElementById('confirmCancelBtn');
        if (modal && msgEl && okBtn && cancelBtn){
          msgEl.textContent = message || '';
          if (titleEl) titleEl.textContent = title || 'Confirm';
          okBtn.textContent = confirmText || 'Yes';
          cancelBtn.textContent = cancelText || 'No';

          const baseBg = okBg || (variant==='danger' ? '#dc2626' : '#0f6a56');
          const hoverBg = okHover || (variant==='danger' ? '#b91c1c' : '#0c5a49');
          const textColor = okColor || '#ffffff';
          const radius = '12px';
          okBtn.style.background = baseBg;
          okBtn.style.color = textColor;
          okBtn.style.border = '0';
          okBtn.style.padding = '10px 16px';
          okBtn.style.borderRadius = radius;
          okBtn.style.cursor = 'pointer';
          okBtn.style.fontWeight = '700';
          okBtn.style.minWidth = '96px';
          okBtn.style.boxShadow = '0 6px 18px rgba(0,0,0,0.10)';
          okBtn.onmouseenter = () => okBtn.style.background = hoverBg;
          okBtn.onmouseleave = () => okBtn.style.background = baseBg;
          okBtn.onfocus = () => okBtn.style.outline = '3px solid rgba(15,106,86,0.25)';
          okBtn.onblur = () => okBtn.style.outline = '';

          cancelBtn.style.background = '#f3f4f6';
          cancelBtn.style.color = '#111827';
          cancelBtn.style.border = '1px solid #e5e7eb';
          cancelBtn.style.padding = '10px 16px';
          cancelBtn.style.borderRadius = radius;
          cancelBtn.style.cursor = 'pointer';
          cancelBtn.style.fontWeight = '700';
          cancelBtn.style.minWidth = '96px';
          cancelBtn.onmouseenter = () => cancelBtn.style.background = '#e5e7eb';
          cancelBtn.onmouseleave = () => cancelBtn.style.background = '#f3f4f6';

          modal.style.display = 'flex';
          document.body.style.overflow = 'hidden';
          return new Promise(resolve => {
            function cleanup(){
              modal.style.display = 'none';
              document.body.style.overflow = 'auto';
              okBtn.removeEventListener('click', onOk);
              cancelBtn.removeEventListener('click', onCancel);
              document.removeEventListener('keydown', onKey);
            }
            function onOk(){ cleanup(); resolve(true); }
            function onCancel(){ cleanup(); resolve(false); }
            function onKey(e){ if(e.key==='Escape') onCancel(); if(e.key==='Enter') onOk(); }

            okBtn.addEventListener('click', onOk);
            cancelBtn.addEventListener('click', onCancel);
            document.addEventListener('keydown', onKey);
          });
        }

        // Fallback overlay
        return new Promise(resolve => {
          const overlay = document.createElement('div');
          overlay.style.position='fixed'; overlay.style.inset='0'; overlay.style.background='rgba(0,0,0,0.45)';
          overlay.style.display='flex'; overlay.style.alignItems='center'; overlay.style.justifyContent='center';
          overlay.style.zIndex='2000';

          const panel = document.createElement('div');
          panel.style.background='#fff'; panel.style.borderRadius='12px'; panel.style.boxShadow='0 12px 40px rgba(2,6,23,0.2)';
          panel.style.padding='18px'; panel.style.maxWidth='420px'; panel.style.width='92%';

          const h = document.createElement('div'); h.style.fontWeight='700'; h.style.marginBottom='8px'; h.style.fontSize='16px'; h.textContent=title;
          const p = document.createElement('div'); p.style.color='#374151'; p.style.fontSize='14px'; p.style.marginBottom='14px'; p.textContent=message;
          const actions = document.createElement('div'); actions.style.display='flex'; actions.style.justifyContent='flex-end'; actions.style.gap='8px';

          const cancel = document.createElement('button');
          cancel.textContent = cancelText; cancel.style.padding='10px 16px'; cancel.style.border='1px solid #e5e7eb'; cancel.style.borderRadius='12px';
          cancel.style.background='#f3f4f6'; cancel.style.cursor='pointer'; cancel.style.fontWeight='700'; cancel.style.color='#111827';
          cancel.addEventListener('mouseenter', ()=> { cancel.style.background = '#e5e7eb'; });
          cancel.addEventListener('mouseleave', ()=> { cancel.style.background = '#f3f4f6'; });

          const confirm = document.createElement('button');
          confirm.textContent = confirmText; confirm.style.padding='10px 16px'; confirm.style.border='0'; confirm.style.borderRadius='12px'; confirm.style.cursor='pointer'; confirm.style.fontWeight='700';
          let baseBg = okBg || (variant==='danger' ? '#dc2626' : '#0f6a56');
          let hoverBg = okHover || (variant==='danger' ? '#b91c1c' : '#0c5a49');
          let textColor = okColor || '#fff';
          confirm.style.background = baseBg; confirm.style.color = textColor; confirm.style.boxShadow = '0 6px 18px rgba(0,0,0,0.10)';
          confirm.addEventListener('mouseover', ()=> { confirm.style.background = hoverBg; });
          confirm.addEventListener('mouseout', ()=> { confirm.style.background = baseBg; });

          function cleanup(result){ document.removeEventListener('keydown', onKey); overlay.remove(); resolve(result); }
          function onKey(e){ if(e.key==='Escape') cleanup(false); if(e.key==='Enter') cleanup(true); }

          cancel.addEventListener('click', ()=> cleanup(false));
          confirm.addEventListener('click', ()=> cleanup(true));
          overlay.addEventListener('click', (e)=>{ if(e.target===overlay) cleanup(false); });

          actions.appendChild(cancel); actions.appendChild(confirm);
          panel.appendChild(h); panel.appendChild(p); panel.appendChild(actions);
          overlay.appendChild(panel);
          document.body.appendChild(overlay);
          document.addEventListener('keydown', onKey);
          setTimeout(()=> confirm.focus(), 0);
        });
      }
      window.showConfirm = window.showConfirm || showConfirm;

      if (viewAccountLink){
        viewAccountLink.addEventListener('click', (e) => {
          e.preventDefault();
          toggleDropdown(false);
          toast('Profile editor coming soon.');
        });
      }

      async function doLogoutFlow(disableEl){
        try {
          const ok = await showConfirm('Are you sure you want to log out?', {
            okText: 'Yes',
            cancelText: 'No',
            okBg: '#0f6a56',
            okHover: '#0c5a49',
            okColor: '#ffffff'
          });
          if (!ok) return;
          if (disableEl) { disableEl.disabled = true; disableEl.style.opacity = '.6'; }
          if (typeof window.logout === 'function') { await window.logout(); }
          try { ['weeklyAvailability_byWeekday','dateExceptions','holidayDates'].forEach(k=>localStorage.removeItem(k)); } catch(_){ }
          window.location.href = 'counselor_login.html';
        } catch (err) {
          console.error('Logout failed', err);
          toast('Failed to log out. Please try again.');
        } finally {
          if (disableEl) { disableEl.disabled = false; disableEl.style.opacity = ''; }
        }
      }

      if (dropdownLogoutBtn){
        dropdownLogoutBtn.addEventListener('click', async (e) => {
          e.preventDefault();
          toggleDropdown(false);
          await doLogoutFlow(dropdownLogoutBtn);
        });
      }
    })();
    });
  </script>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>SafeSpace — Counselor Portal</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Basic CSS only, no frameworks */
    :root{
      --green:#0f7a34;
      --panel:#ffffff;
      --muted:#6b7280;
      --bg:#f4f6fb;
      --card-shadow: 0 6px 18px rgba(16,24,40,0.06);
      --radius:10px;
    }
  *{box-sizing:border-box}
  body{margin:0;font-family: 'Inter', Arial, Helvetica, sans-serif;background:var(--bg);color:#0f172a; -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale}
    .app{display:flex;min-height:100vh}

    /* Sidebar */
    .sidebar{
      width:250px;
      background:#f0f3f6;
      border-right:1px solid rgba(0,0,0,0.06);
      display:flex;flex-direction:column;
      position:sticky;
      top:0;
      height:100vh;
      overflow:auto;
      z-index:40;
    }
    .sidebar .top { display:flex;align-items:center;justify-content:space-between;padding:13px 20px;background:var(--green);color:#fff; }
    .logo{font-weight:800;font-size:20px}
    .burger{background:transparent;border:0;color:#fff;font-size:20px;cursor:pointer;padding:6px}

    .nav{padding:12px;display:flex;flex-direction:column;gap:8px}
    .nav button{ display:flex;align-items:center;gap:12px;padding:10px;border-radius:8px;border:0;background:transparent;cursor:pointer;text-align:left;color:#1f2937;font-weight:400; }
    .nav .label { font-size: 15px; }
    .nav button, .nav .nav-item { transition: background .12s ease, color .12s ease; }
    .nav button:hover, .nav .nav-item:hover { background: rgba(15,122,52,0.06); color: var(--green); }
    .nav button.active{background:rgba(15,122,52,0.08);color:var(--green)}
    .nav .icon{width:28px;text-align:center}

    /* larger sidebar icons */
    .nav .icon{ width:56px; display:inline-flex; align-items:center; justify-content:center; font-size:26px; line-height:1; }
    .nav button{ padding:12px 10px; gap:14px; }
    body.collapsed .nav .icon{ width:56px; font-size:26px; justify-content:center; }
    body.collapsed .nav button{ justify-content:center; padding:12px 6px; }
    body.collapsed .nav button .label{display:none}
    body.collapsed .sidebar .bottom .logged{display:none}
    body.collapsed .sidebar .top .logo{display:none}
    @media (max-width:720px){ .nav .icon{ width:56px; font-size:22px; } .icon-btn{ font-size:24px; } .avatar{ width:48px; height:48px; font-size:16px; } }
    .sidebar .bottom{margin-top:auto;padding:12px;border-top:1px solid rgba(0,0,0,0.04)}
    .logged{font-size:13px;color:#374151}

    /* Main area */
    .main{flex:1;display:flex;flex-direction:column}
    .topbar{display:flex;align-items:center;justify-content:space-between;padding:35px 22px;background:var(--green);color:#fff;position:sticky;top:0;z-index:50;backdrop-filter: blur(4px);-webkit-backdrop-filter: blur(4px);}    
    .brand{display:flex;flex-direction:column}
    .brand .title{font-size:28px;font-weight:800;line-height:1}
    .brand .sub{font-size:13px;opacity:0.95}
    .top-right{display:flex;align-items:center;gap:12px}
    .icon-btn{background:transparent;border:0;color:#fff;font-size:20px;cursor:pointer}
    .avatar{width:40px;height:40px;border-radius:50%;background:#fff;color:var(--green);display:flex;align-items:center;justify-content:center;font-weight:800}

    /* Content grid */
    .content{padding:20px}
    .grid{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}
    .grid { grid-auto-rows: minmax(140px, 1fr); align-items: start; }

    /* Card layout */
    .card { display:flex; flex-direction:column; height:100%; }
    .card .body { flex:1 1 auto; }
    .card .view-btn, .card .btn-row { margin-top:12px; align-self:stretch; }
    .card{ background:var(--panel);border-radius:var(--radius);box-shadow:var(--card-shadow); padding:14px;grid-column:span 6; }
    .card h3{margin:0 0 8px 0;font-size:16px}
    .card .body{font-size:14px;color:#111}

    /* Events view button styles (appointments removed) */
    .events.card { display:flex; flex-direction:column; }
    .events .body { flex: 1 1 auto; }
    .events .view-btn { margin-top:12px; align-self:stretch; }
    .events .view-btn .btn { display:block; width:100%; padding:12px 18px; border-radius:12px; background:#2563eb; color:#fff; font-weight:700; border:0; cursor:pointer; text-align:center; }
    .events .view-btn .btn:hover { filter:brightness(.95); }

  /* Calendar removed per request */

    .reminders{grid-column:span 6}
    .add-task{display:flex;gap:8px;margin-bottom:10px}
    .add-task input{flex:1;padding:8px;border-radius:8px;border:1px solid #e6eef7}
    .add-task button{padding:8px 12px;border-radius:8px;border:0;background:#10b981;color:#fff;cursor:pointer}

    .task{display:flex;justify-content:space-between;align-items:center;padding:8px;border-bottom:1px solid #f3f4f6}
    .task .left{display:flex;align-items:center;gap:8px}
    .task .text.done{text-decoration:line-through;color:var(--muted)}

    .events{grid-column:span 6}
    .events-list{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:10px}
    .events-list li{padding:10px;border-radius:8px;border:1px solid #f3f4f6;cursor:pointer}
    .event-title{font-weight:700}
    .event-meta{font-size:13px;color:var(--muted)}

    /* Greeting area */
  .greeting-card{grid-column:span 12;padding:14px;margin-bottom:10px;border-radius:14px;background:var(--panel);box-shadow:var(--card-shadow);display:flex;justify-content:space-between;align-items:center}

    /* Responsive */
    @media(max-width:1000px){ .grid{grid-template-columns:repeat(8,1fr)} .reminders{grid-column:span 8} .events{grid-column:span 8} }
    @media(max-width:720px){
      .sidebar{ width:260px; position:fixed; left:0; top:0; height:100vh; transform:translateX(-100%); transition:transform .28s ease; box-shadow:0 12px 40px rgba(2,6,23,0.12); background:#f0f3f6; }
      body.show-sidebar .sidebar{ transform:translateX(0); }
      .main{ margin-left:0; }
      .nav button .label{display:none}
      .brand .title{font-size:20px}
      .grid{grid-template-columns:repeat(6,1fr)}
      .card{padding:12px}
      .reminders,.events{grid-column:span 6}
    }

    /* To-Do / Reminders card (full UI) */
    .reminders .body { padding: 16px; }
    .reminders h3 { margin: 0 0 12px 0; font-size: 18px; font-weight: 700; }
    .reminders .task { padding: 10px 12px; border: 1px solid #e6eef7; border-radius: 8px; background: #fff; display: flex; justify-content: space-between; align-items: center; }
    .reminders .task.done { background: #f0fdf4; border-color: #bbf7d0; }

    /* Content grid - compact rows */
    .grid { grid-auto-rows: minmax(10px, 1fr); align-items: start; }

    /* Responsive overrides (mobile-first, safe defaults) */
    :root{ --sidebar-width:250px; --collapsed-width:80px; --topbar-height:64px; --gap:16px; --content-padding:16px; }
    html { font-size: 15px; }
    @media (min-width:1200px){ html { font-size:16px; } }
    @media (max-width:360px){ html { font-size:14px; } }
    .burger{ z-index: 120; position: relative; display:inline-flex; align-items:center; justify-content:center; width:44px; height:44px; border-radius:8px; }
    .sidebar .top .burger{ margin:0; }
    .content{ padding: var(--content-padding); padding-top: calc(var(--topbar-height) + 12px); transition: padding .2s ease; }
    .grid{ gap: var(--gap); grid-auto-rows: auto; }

    /* Breakpoints for grid columns */
  @media (min-width:1100px){ .grid{ grid-template-columns: repeat(12, 1fr); } .card{ grid-column: span 6; } .reminders, .events { grid-column: span 6; } }
  @media (min-width:820px) and (max-width:1099px){ .grid{ grid-template-columns: repeat(8, 1fr); } .card{ grid-column: span 8; } .reminders, .events { grid-column: span 8; } }
  @media (max-width:819px){ .grid{ grid-template-columns: repeat(6, 1fr); } .card{ grid-column: span 6; } .reminders, .events { grid-column: span 6; } }
    @media (max-width:480px){ .grid{ grid-template-columns: 1fr; } .card{ grid-column: auto; width: 100%; padding:12px; } .greeting-card{ padding:12px; flex-direction:column; align-items:flex-start; gap:8px; } .top-right { gap:8px; } .avatar{ width:36px; height:36px; font-size:14px; } }

    /* Sidebar behavior */
    @media (min-width:721px){ .sidebar{ position:fixed; left:0; top:0; height:100vh; width:var(--sidebar-width); z-index:80; transition:width .18s ease, transform .25s ease; } body.collapsed .sidebar{ width: var(--collapsed-width); } .main{ margin-left: var(--sidebar-width); transition:margin-left .18s ease; } body.collapsed .main{ margin-left: var(--collapsed-width); } .topbar{ position:fixed; left: var(--sidebar-width); right:0; top:0; height:var(--topbar-height); z-index:85; transition:left .18s ease; } body.collapsed .topbar{ left: var(--collapsed-width); } .content{ padding-top: calc(var(--topbar-height) + 12px); } }

    /* Improve touch targets */
    .nav button, .nav .nav-item, .icon-btn, .burger { min-height:44px; padding:10px; }
    .nav .icon{ width:48px; height:48px; display:inline-flex; align-items:center; justify-content:center; }

    /* Card responsiveness */
    .card{ box-sizing:border-box; max-width:100%; }
    .events .view-btn .btn{ width:100%; min-height:44px; }

    /* Accessibility: visible focus states */
    button:focus, .nav button:focus, .icon-btn:focus { outline:3px solid rgba(15,122,52,0.12); outline-offset:2px; }

    /* Utility: make images/icons scale */
    .icon, .avatar { font-size: clamp(14px, 2.6vw, 26px); }

    /* Footer: fixed and visible above content, responsive */
    .site-footer{ position:fixed; bottom:0; left:var(--sidebar-width); right:0; height:56px; display:flex; align-items:center; justify-content:center; background:#fff; border-top:1px solid #eef2f6; z-index:75; font-size:13px; color:#6b7280; }

  <style>

    .student-card {

      position:relative; overflow:visible; transform: none; /* ensure no transform/lift */

    .student-card:hover, .student-card:focus-within {
      box-shadow: 0 8px 26px rgba(8,15,20,0.06); /* unchanged */
      border-color: transparent; /* remove border highlight */
  /* subtle light-green fill (pastel) to match provided swatch; lowered opacity so it's less visible */
  background: linear-gradient(180deg, rgba(125, 241, 152, 0.06), #ffffff);
      transform: none; /* explicitly prevent any lift */
    }

  /* Position and style the sessions badge but make it visually passive */
  .student-card .session-wrap { display:flex; flex-direction:column; align-items:flex-end; gap:8px; min-width:110px; }
  .student-card .session-highlight {
    background: rgba(15,122,52,0.06); /* light passive background */

    box-shadow: none; cursor: default; pointer-events: none; /* non-interactive */

  /* Loading skeleton styles */
  @keyframes shimmer { 0% { background-position: -200% 0 } 100% { background-position: 200% 0 } }
  .skeleton { pointer-events: none; }
  /* stronger contrast for skeletons so they are easier to see */
  .skeleton .skeleton-avatar, .skeleton .skeleton-line, .skeleton .skeleton-badge { background: linear-gradient(90deg,#e6f5ec 0%, #d6efe0 50%, #e6f5ec 100%); background-size: 200% 100%; animation: shimmer 1.2s linear infinite; border-radius:8px; }
