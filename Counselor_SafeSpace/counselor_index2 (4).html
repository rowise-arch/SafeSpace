<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Consultation Messenger (RTDB) - Counselor Starts (Auto Refresh)</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen flex items-center justify-center p-4 bg-gray-100">
  <div id="app" class="bg-white rounded-xl shadow-2xl w-full max-w-4xl h-[90vh] flex flex-col overflow-hidden">
    <header class="p-4 border-b border-gray-100 flex justify-between items-center bg-blue-600 text-white">
      <h1 class="text-xl font-bold">💬 Consultation Desk (RTDB)</h1>
      <div id="user-info" class="text-sm flex items-center space-x-4">
        <span id="user-display">Authenticating...</span>
        <button id="sign-out-btn" onclick="handleSignOut()" class="hidden bg-red-500 hover:bg-red-600 text-white text-xs px-3 py-1 rounded-full shadow-md">Sign Out</button>
      </div>
    </header>

    <div id="main-content" class="flex-grow flex overflow-hidden">
      <div id="loading-screen" class="p-8 w-full flex items-center justify-center text-gray-500 text-lg">Checking session...</div>

      <div id="auth-view" class="hidden p-8 w-full flex flex-col items-center justify-center space-y-6">
        <h2 class="text-3xl font-bold text-gray-700">Consultation Login</h2>
        <div class="w-full max-w-md bg-gray-50 p-6 rounded-xl shadow-lg space-y-4">
          <input id="auth-email" type="email" placeholder="Email Address" class="w-full p-3 border border-gray-300 rounded-lg" />
          <input id="auth-password" type="password" placeholder="Password" class="w-full p-3 border border-gray-300 rounded-lg" />
          <p id="auth-message" class="text-sm text-red-500"></p>
          <div class="pt-2">
            <button onclick="handleAuth()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 rounded-lg">Login</button>
          </div>
        </div>
      </div>

      <div id="dashboard-view" class="hidden w-full h-full flex">
        <div id="consultation-list" class="w-1/3 border-r border-gray-200 flex flex-col bg-gray-50 overflow-y-auto"></div>

        <div id="chat-display" class="w-2/3 flex flex-col p-6">
          <div id="initial-message" class="flex-grow flex items-center justify-center text-gray-400 text-center">
            <div id="student-actions" class="hidden w-full max-w-lg mx-auto text-left"></div>
            <div id="counselor-actions" class="hidden"></div>
          </div>
          <div id="messenger" class="hidden flex-grow flex flex-col h-full">
            <div id="chat-header" class="border-b border-gray-200 pb-3 mb-4">
              <h3 class="text-xl font-bold text-gray-800"></h3>
              <p class="text-sm text-gray-500"></p>
            </div>
            <div id="messages-container" class="flex-grow overflow-y-auto space-y-4 pr-2"></div>
            <div id="message-input-area" class="pt-4 border-t border-gray-200">
              <div class="flex space-x-2">
                <input id="message-input" type="text" placeholder="Type your message..." class="flex-grow p-3 border border-gray-300 rounded-lg" onkeydown="if(event.key==='Enter') sendMessage()">
                <button onclick="sendMessage()" class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded-lg">Send</button>
                <button onclick="closeConsultation()" class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-lg text-sm">Close Chat</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    // Use centralized Firebase initializer and auth helpers
    import { initFirebase, login, logout, watchAuth } from './auth-db.js';
    import { ref, set, push, update, get, onValue, query, orderByChild, equalTo, onDisconnect, remove } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-database.js";

    // Initialize Firebase once using the central helper
    const { app, db, auth } = initFirebase();

    let userRole = null, userName = '', currentUserId = null, consultations = [], activeConsultationId = null;
    let onlineCounselors = {};
    let refreshInterval = null;

  // Detect if counselor came from counselor_appointment.html
    window.addEventListener("load", async () => {
      const params = new URLSearchParams(window.location.search);
      if (params.get("role") === "counselor" && params.get("auto") === "start") {
        const waitForAuth = setInterval(() => {
          if (userRole === "counselor" && currentUserId) {
            clearInterval(waitForAuth);
            startConsultationSessionAuto();
          }
        }, 1000);
      }
    });

    async function startConsultationSessionAuto() {
      const topic = "Counseling Session (Auto-started)";
      const refKey = push(ref(db, "consultations"));
      await set(refKey, {
        counselorId: currentUserId,
        counselorName: userName,
        studentId: null,
        studentName: null,
        topic: topic,
        status: "OPEN",
        createdAt: Date.now(),
        messages: [{
          senderId: "SYSTEM",
          text: `[System] Counselor started an automatic session.`,
          timestamp: Date.now(),
        }],
      });
      alert("Chat session started. Waiting for student to join.");
    }

    window.handleAuth = async function () {
      const email = document.getElementById('auth-email').value;
      const password = document.getElementById('auth-password').value;
      const msg = document.getElementById('auth-message');
      msg.textContent = '';
      try {
        // use centralized login wrapper
        await login(email, password);
      } catch (e) {
        msg.textContent = 'Login failed.';
      }
    };

    // use centralized auth watcher
    watchAuth(async (user) => {
      const signBtn = document.getElementById('sign-out-btn');
      if (!user) {
        document.getElementById('auth-view').classList.remove('hidden');
        document.getElementById('dashboard-view').classList.add('hidden');
        // hide sign out button when signed out
        if (signBtn) signBtn.classList.add('hidden');
        document.getElementById('user-display').textContent = 'Not signed in';
        return;
      }
      currentUserId = user.uid;
      // show sign out button and update display
      if (signBtn) { signBtn.classList.remove('hidden'); }
      document.getElementById('user-display').textContent = `Authententicated: ${user.email}`;
      await detectUserRoleFromRTDB();
      renderAppView();
      setupPresenceTracking();
      setupConsultationListener();
      if (userRole === 'student') startAutoRefreshSessions();
    });

    async function detectUserRoleFromRTDB() {
      const studentsQ = query(ref(db, 'students'), orderByChild('uid'), equalTo(currentUserId));
      const counselorsQ = query(ref(db, 'counselors'), orderByChild('uid'), equalTo(currentUserId));

      const studentSnap = await get(studentsQ);
      const counselorSnap = await get(counselorsQ);

      if (studentSnap.exists()) {
        userRole = 'student';
        const val = Object.values(studentSnap.val())[0];
        userName = `${val.first_name} ${val.last_name}`;
      } else if (counselorSnap.exists()) {
        userRole = 'counselor';
        const val = Object.values(counselorSnap.val())[0];
        userName = `${val.first_name} ${val.last_name}`;
      } else {
        userRole = 'unknown';
        userName = auth.currentUser.email;
      }
      document.getElementById('user-display').textContent = `Role: ${userRole.toUpperCase()} | ${userName}`;
      document.getElementById('auth-view').classList.add('hidden');
      document.getElementById('dashboard-view').classList.remove('hidden');
    }

    function setupPresenceTracking() {
      if (userRole === 'counselor') {
        const presenceRef = ref(db, `presence/${currentUserId}`);
        onDisconnect(presenceRef).remove();
        set(presenceRef, { status: 'online', name: userName });
      }
      const presencePath = ref(db, 'presence');
      onValue(presencePath, (snapshot) => {
        onlineCounselors = snapshot.val() || {};
        if (userRole === 'student') renderAvailableSessions();
      });
    }

    function renderAppView() {
      document.getElementById('student-actions').classList.add('hidden');
      document.getElementById('counselor-actions').classList.add('hidden');
      if (userRole === 'counselor') {
        document.getElementById('counselor-actions').innerHTML = `
          <h3 class='text-xl font-semibold mb-4 text-gray-700'>Start a Consultation Session</h3>
          <input id='topic-input' type='text' placeholder='Enter consultation topic...' class='w-full p-3 border border-gray-300 rounded-lg mb-4'>
          <button onclick='startConsultationSession()' class='bg-blue-600 hover:bg-blue-700 text-white w-full py-2 rounded-lg'>Start Session</button>
          <p id='session-message' class='mt-3 text-sm'></p>`;
        document.getElementById('counselor-actions').classList.remove('hidden');
      } else if (userRole === 'student') {
        document.getElementById('student-actions').innerHTML = `
          <h3 class='text-xl font-semibold mb-4 text-gray-700'>Join a Counselor Session</h3>
          <p class='text-gray-500 mb-4'>Wait for a counselor to start a session. Available sessions will auto-refresh every 10 seconds.</p>
          <div id='available-sessions' class='space-y-2 max-h-64 overflow-y-auto p-2 border rounded-xl bg-white shadow-inner'></div>`;
        document.getElementById('student-actions').classList.remove('hidden');
      }
    }

    async function startConsultationSession() {
  const topicInput = document.getElementById('topic-input');
  const msg = document.getElementById('session-message');
  const topic = topicInput.value.trim();

  if (topic.length < 5) {
    msg.textContent = 'Topic must be at least 5 characters long.';
    return;
  }

  const refKey = push(ref(db, 'consultations'));

  const consultationData = {
    counselorId: currentUserId,
    counselorName: userName,
    studentId: null,
    studentName: null,
    topic: topic,
    status: 'OPEN',
    createdAt: Date.now(),
    messages: [
      {
        senderId: 'SYSTEM',
        text: `[System] Counselor started a session about "${topic}".`,
        timestamp: Date.now()
      }
    ],
  };

  // ✅ Log the data before sending
  console.log("Sending consultation data to Firebase:", consultationData);

  await set(refKey, consultationData);

  msg.textContent = 'Session started successfully!';
  topicInput.value = '';
}

    

  // expose for inline onclick handlers
    window.startConsultationSession = startConsultationSession;

    async function joinCounselorSession(id) {
      const sessionRef = ref(db, 'consultations/' + id);
      const snap = await get(sessionRef);
      const s = snap.val();
      if (!s || s.status !== 'OPEN') return;
      if (!onlineCounselors[s.counselorId]) {
        alert('This counselor is no longer online.');
        return;
      }
      await update(sessionRef, {
        studentId: currentUserId,
        studentName: userName,
        status: 'ACCEPTED',
        messages: [...(s.messages || []), { senderId: 'SYSTEM', text: `[System] ${userName} joined the consultation.`, timestamp: Date.now() }],
      });
        setActiveConsultation(id);
      }

      // expose join function for inline onclicks
    window.joinCounselorSession = joinCounselorSession;

    function setupConsultationListener() {
      const consRef = ref(db, 'consultations');
      onValue(consRef, (snap) => {
        const data = snap.val() || {};
        consultations = Object.keys(data).map(k => ({ id: k, ...data[k] }));
        renderConsultations();
        if (userRole === 'student') renderAvailableSessions();
      });
    }

    function renderAvailableSessions() {
      const container = document.getElementById('available-sessions');
      if (!container) return;
      const openSessions = consultations.filter(c => c.status === 'OPEN' && onlineCounselors[c.counselorId]);
      container.innerHTML = '';
      if (openSessions.length === 0) {
        container.innerHTML = '<p class="text-center text-gray-500 text-sm p-2">No open sessions from online counselors right now.</p>';
        return;
      }
      openSessions.forEach(s => {
        const div = document.createElement('div');
        div.className = 'p-3 border rounded-lg flex justify-between items-center';
        div.innerHTML = `<div><p class='font-semibold text-gray-800'>${s.topic}</p><p class='text-sm text-gray-500'>Counselor: ${s.counselorName} <span class='text-green-600'>(Online)</span></p></div><button onclick="joinCounselorSession('${s.id}')" class='bg-green-500 hover:bg-green-600 text-white px-3 py-1 rounded text-xs'>Join</button>`;
        container.appendChild(div);
      });
    }

    function startAutoRefreshSessions() {
      if (refreshInterval) clearInterval(refreshInterval);
      refreshInterval = setInterval(() => {
        renderAvailableSessions();
      }, 10000);
    }

    function renderConsultations() {
      const listEl = document.getElementById('consultation-list');
      listEl.innerHTML = '<div class="p-3 font-bold text-lg border-b bg-white text-gray-700 sticky top-0 z-10">My Consultations</div>';
      const relevant = consultations.filter(c => (userRole==='counselor' && c.counselorId===currentUserId) || (userRole==='student' && c.studentId===currentUserId));
      if (relevant.length===0){listEl.innerHTML += '<p class="p-4 text-gray-500 text-sm">No consultations found.</p>';return;}
      relevant.forEach(c=>{
        const item=document.createElement('div');
        item.className='p-4 border-b border-gray-100 cursor-pointer hover:bg-gray-100';
        item.setAttribute('onclick',`setActiveConsultation('${c.id}')`);
        item.innerHTML=`<div class='font-semibold text-gray-800'>${c.topic}</div><div class='text-xs text-gray-500'>${c.status}</div>`;
        listEl.appendChild(item);
      });
    }

  // --- Consultation open / render helpers ---------------------------------
  let _consUnsub = null;

  function renderMessagesToContainer(msgs){
    const container = document.getElementById('messages-container');
    if (!container) return;
    container.innerHTML = '';
    // helper to safely extract the text to display from a message object
    function getMsgText(m){
      if (m == null) return '';
      if (typeof m === 'string') return m;
      if (typeof m.text === 'string') return m.text;
      if (typeof m.message === 'string') return m.message;
      const tryExtract = (obj) => {
        if (!obj || typeof obj !== 'object') return null;
        for (const k in obj){
          if (typeof obj[k] === 'string') return obj[k];
          if (typeof obj[k] === 'object'){
            const found = tryExtract(obj[k]);
            if (found) return found;
          }
        }
        return null;
      };
      const found = tryExtract(m.text) || tryExtract(m.message) || tryExtract(m);
      return found || JSON.stringify(m);
    }

    (msgs || []).forEach(m => {
      const isMine = m.senderId === currentUserId;
      const wrapper = document.createElement('div');
      wrapper.className = isMine ? 'flex items-end justify-end gap-2' : 'flex items-end gap-2';
      if (!isMine) {
        const avatar = document.createElement('div');
        avatar.className = 'w-8 h-8 rounded-full bg-green-500 text-white text-sm font-semibold flex items-center justify-center';
        avatar.textContent = (m.senderName || m.senderId || 'S').toString().split(' ').map(s=>s[0]).slice(0,2).join('');
        const bubble = document.createElement('div');
        bubble.className = 'bg-gray-200 text-gray-900 text-sm px-4 py-2 rounded-2xl rounded-tl-none max-w-[60%]';
        bubble.textContent = getMsgText(m);
        wrapper.appendChild(avatar);
        wrapper.appendChild(bubble);
      } else {
        const bubble = document.createElement('div');
        bubble.className = 'bg-blue-500 text-white text-sm px-4 py-2 rounded-2xl rounded-tr-none max-w-[60%]';
        bubble.textContent = getMsgText(m);
        const avatar = document.createElement('div');
        avatar.className = 'w-8 h-8 rounded-full bg-green-500 text-white text-sm font-semibold flex items-center justify-center';
        avatar.textContent = (m.senderName || 'Me').toString().slice(0,2);
        wrapper.appendChild(bubble);
        wrapper.appendChild(avatar);
      }
      container.appendChild(wrapper);
    });
    container.scrollTop = container.scrollHeight;
  }

  async function setActiveConsultation(id){
    try {
      console.log('Opening consultation:', id);
      activeConsultationId = id;
      // show messenger, hide initial
      const messenger = document.getElementById('messenger');
      const initial = document.getElementById('initial-message');
      if (initial) initial.classList.add('hidden');
      if (messenger) messenger.classList.remove('hidden');

      // cleanup previous listener
      if (typeof _consUnsub === 'function') { try { _consUnsub(); } catch(e){}; _consUnsub = null; }

      // ensure DOM bits
      const headerTitle = document.querySelector('#chat-header h3');
      const headerSub = document.querySelector('#chat-header p');
      const container = document.getElementById('messages-container');

      // attach realtime listener
      const consRef = ref(db, `consultations/${id}`);
      const listener = onValue(consRef, (snap) => {
        const val = snap.val() || {};
        if (headerTitle) headerTitle.textContent = val.topic || 'Consultation';
        if (headerSub) headerSub.textContent = val.counselorName ? `Counselor: ${val.counselorName}` : '';
        const msgs = val.messages || [];
        renderMessagesToContainer(msgs);
      });

      _consUnsub = () => { try { listener(); } catch(e){} };
      // expose globally for other modules
      window.activeConsultationId = id;
    } catch (err) {
      console.error('Failed to open consultation', err);
      alert('Failed to open consultation: ' + (err.message || err));
    }
  }
  // expose active setter for inline handlers
  window.setActiveConsultation = setActiveConsultation;

  // expose messenger helpers
  window.sendMessage = async function(){
    try {
      const input = document.getElementById('message-input');
      if (!input) return;
      const text = input.value.trim();
      if (!text) return;
      const id = window.activeConsultationId || activeConsultationId;
      if (!id) { alert('No active consultation'); return; }
      const consRef = ref(db, `consultations/${id}`);
      const snap = await get(consRef);
      const data = snap.val() || {};
      const msgs = data.messages || [];
      msgs.push({ senderId: currentUserId, senderName: userName, text: text, timestamp: Date.now() });
      await update(consRef, { messages: msgs });
      input.value = '';
    } catch (err) {
      console.error('sendMessage error', err);
      alert('Failed to send message: ' + (err.message || err));
    }
  };

  window.closeConsultation = async function(){
    try {
      const id = window.activeConsultationId || activeConsultationId;
      if (!id) return;
      await update(ref(db, `consultations/${id}`), { status: 'CLOSED' });
      if (typeof _consUnsub === 'function') { try { _consUnsub(); } catch(e){}; _consUnsub = null; }
      // hide messenger, show initial
      const messenger = document.getElementById('messenger');
      const initial = document.getElementById('initial-message');
      if (messenger) messenger.classList.add('hidden');
      if (initial) initial.classList.remove('hidden');
      window.activeConsultationId = null;
      activeConsultationId = null;
    } catch (err) {
      console.error('closeConsultation error', err);
      alert('Failed to close consultation: ' + (err.message || err));
    }
  };
    window.handleSignOut=async function(){
      if (userRole==='counselor'){
        const presenceRef=ref(db,`presence/${currentUserId}`);
        onDisconnect(presenceRef).cancel();
        remove(presenceRef);
      }
      if (refreshInterval) clearInterval(refreshInterval);
      // use centralized logout wrapper
      await logout();
    };
  </script>
</body>
</html>
